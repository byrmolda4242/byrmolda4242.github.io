<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭтноГид</title>
    
    <!-- Шрифт Inter для современного минимализма -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #1E3A8A; /* Глубокий полуночный синий */
            --accent-color: #3B82F6; /* Чистый синий (как гжель) */
            --bg-color: #FDFDFD; /* Почти белый, цвет бумаги */
            --text-color: #111827; /* Темно-серый вместо черного */
            --muted-text: #6B7280;
            --card-bg: #FFFFFF;
            --border-color: #E5E7EB; /* Очень светлый серый */
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), #0C2340);
            color: white;
            text-align: center;
            padding: 4rem 1rem 3rem;
            position: relative;
        }

        /* Эффект северного сияния (тонкий градиентный блик) */
        header::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 300px;
            background: linear-gradient(to top, var(--bg-color), rgba(255,255,255,0));
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
        }
        header p {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.9;
            margin-top: 0.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        main {
            max-width: 960px;
            margin: -60px auto 0; /* Сильное наложение на шапку */
            padding: 0 1rem 3rem;
        }

        section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 1.5rem;
            position: relative;
            padding-left: 12px;
        }
        h2::after {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 24px;
            background: var(--accent-color);
            border-radius: 9999px;
        }

        /* Строгая форма регистрации */
        #regForm {
            display: grid;
            gap: 1rem;
            grid-template-columns: 1fr 1fr;
        }
        #regForm input, #regForm select {
            padding: 0.9rem 1rem;
            font-size: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background: #F9FAFB;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-weight: 400;
        }
        #regForm input:focus, #regForm select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        #regForm button {
            grid-column: span 2;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: var(--radius);
            border: none;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        #regForm button:hover {
            background: #1c3271;
            transform: translateY(-1px);
        }

        /* Сетка карточек */
        #craftsGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        .craft-card {
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem 1rem;
            text-align: center;
            background: #F9FAFB;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .craft-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .craft-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }
        .craft-card h3 {
            font-family: 'Inter', sans-serif;
            margin: 0.5rem 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
        }
        .craft-card p {
            color: var(--muted-text);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        /* Список событий */
        .event-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1.2rem;
            background: #F9FAFB;
            border-radius: var(--radius);
            border-left: 4px solid var(--accent-color);
            transition: background 0.2s;
        }
        .event-item:hover {
            background: #FFFFFF;
        }
        .event-date {
            flex-shrink: 0;
            font-weight: 500;
            color: var(--primary-color);
            white-space: nowrap;
        }
        .event-details {
            flex-grow: 1;
        }
        .event-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0 0 0.25rem 0;
            color: var(--text-color);
        }
        .event-location {
            font-size: 0.9rem;
            color: var(--muted-text);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--muted-text);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            #regForm {
                grid-template-columns: 1fr;
            }
            #regForm button {
                grid-column: span 1;
            }
            main {
                margin-top: -40px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>ЭтноГид</h1>
        <p>Культура народов России в одном приложении. Образование, мастер-классы и традиции.</p>
    </header>

    <main>
        <section id="registration">
            <h2>Ваш профиль</h2>
            <form id="regForm">
                <input type="text" id="username" placeholder="Имя" required>
                <input type="email" id="useremail" placeholder="Email" required>
                <select id="interest" required>
                    <option value="" disabled selected>Ваши интересы</option>
                    <option value="music">Музыка</option>
                    <option value="crafts">Ремёсла</option>
                    <option value="dance">Танец</option>
                    <option value="history">История</option>
                </select>
                <button type="submit">Сохранить профиль</button>
            </form>
            <p id="regStatus"></p>
        </section>

        <section id="catalog">
            <h2>Ремёсла</h2>
            <div id="craftsGrid"></div>
        </section>

        <section id="calendar">
            <h2>События</h2>
            <div id="eventsList"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ЭтноГид. Сделано с уважением к традициям.</p>
    </footer>

    <script>
        const craftsData = [
            { id: 1, name: "Хохлома", region: "Поволжье", icon: "🪵", description: "Деревянная посуда" },
            { id: 2, name: "Гжель", region: "Подмосковье", icon: "💙", description: "Кобальтовая керамика" },
            { id: 3, name: "Уфтюжская роспись", region: "Архангельская обл.", icon: "🎨", description: "Северная сказка" },
            { id: 4, name: "Мезень", регион: "Поморье", icon: "🐎", описание: "Лошади и олени" }
        ];

        const eventsData = [
            { id: 1, title: "Лекция: Символы в русской вышивке", date: "2026-11-05", location: "онлайн, Zoom" },
            { id: 2, title: "Мастер-класс: Лепка из глины", date: "2026-11-08", location: "г. Москва, м. Курская" },
            { id: 3, title: "Фестиваль 'Северная вязь'", date: "2026-11-15", location: "г. Архангельск" },
            { id: 4, title: "Экскурсия в музей игрушки", date: "2026-11-11", location: "г. Сергиев Посад" }
        ];

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('username').value;
            const statusElem = document.getElementById('regStatus');
            if (name) {
                statusElem.style.color = 'var(--accent-color)';
                statusElem.textContent = `Профиль сохранен, ${name}.`;
            } else {
                statusElem.style.color = '#dc2626';
                statusElem.textContent = 'Введите имя.';
            }
        });

        const grid = document.getElementById('craftsGrid');
        craftsData.forEach(craft => {
            const card = document.createElement('div');
            card.className = 'craft-card';
            card.innerHTML = `
                <span class="craft-icon">${craft.icon}</span>
                <h3>${craft.name}</h3>
                <p>${craft.description}</p>
            `;
            grid.appendChild(card);
        });

        const eventsList = document.getElementById('eventsList');
        eventsData.forEach(event => {
            const item = document.createElement('div');
            item.className = 'event-item';
            
            const dateObj = new Date(event.date);
            const options = { day: 'numeric', month: 'short' };
            const formattedDate = dateObj.toLocaleDateString('ru-RU', options);

            item.innerHTML = `
                <div class="event-date">${formattedDate}</div>
                <div class="event-details">
                    <div class="event-title">${event.title}</div>
                    <div class="event-location">${event.location}</div>
                </div>
            `;
            eventsList.appendChild(item);
        });
    </script>
</body>
</html>
